<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1e3d">
<title>今夜の泊まり先</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="head">
    <h1>今夜どこでねる？</h1>
  </header>

  <!-- 共有リンクで開いたときだけ出る -->
  <section id="shared" class="shared" hidden></section>

  <!-- 前の晩に決めた分の、朝の結果を記録する -->
  <section id="record" class="record" hidden></section>

  <!-- 1問ずつ聞いて、最後に当てる -->
  <section id="quiz" class="quiz" aria-live="polite"></section>

  <section id="decided" class="decided" hidden></section>

  <!-- 答えが出るまでは隠す（先に見えると当てものにならない） -->
  <section class="result" id="all" hidden>
    <h2>ぜんぶの候補</h2>
    <ol id="ranking" class="ranking"></ol>
    <p class="note">並び順は「最速の準備完了の遅さ」「崩れたときの遅れ × 崩れる見込み」「体調の不安」「今夜の移動」「相手の移動」を分に直して足した小さい順です。最速の準備完了は、理想の起床どおりに起きたときの時刻です。崩れる見込みは、朝の記録が増えるほど実績に寄っていきます。</p>
  </section>

  <details class="more">
    <summary>くわしい設定（朝・駅・候補）</summary>

    <section class="morning">
      <h2>明日の朝</h2>
      <div class="morning-box">
        <div class="fields">
          <label class="field">
            <span>準備を終えたい時刻</span>
            <input type="time" id="m-ready">
          </label>
          <label class="field">
            <span>準備にかかる時間</span>
            <span class="unit"><input type="number" id="m-prep" min="0" step="5" inputmode="numeric">分</span>
          </label>
          <label class="field">
            <span>起きてから出るまで</span>
            <span class="unit"><input type="number" id="m-getup" min="0" step="5" inputmode="numeric">分</span>
          </label>
          <label class="field">
            <span>理想の起床</span>
            <input type="time" id="m-ideal">
          </label>
        </div>
      </div>
    </section>

    <section class="stations">
      <h2>駅と移動時間</h2>
      <div class="morning-box">
        <div class="fields">
          <label class="field">
            <span>撮影する人の名前</span>
            <input type="text" id="s-self-name" placeholder="例：撮影する人">
          </label>
          <label class="field">
            <span>撮影場所（その人の家）の駅</span>
            <input type="text" id="s-base" placeholder="例：〇〇" list="station-list">
          </label>
          <label class="field">
            <span>駅から家まで</span>
            <span class="unit"><input type="number" id="s-base-walk" min="0" step="1" inputmode="numeric">分</span>
          </label>
          <label class="field">
            <span>相手の名前</span>
            <input type="text" id="s-partner-name" placeholder="例：相手">
          </label>
          <span class="field" aria-hidden="true"></span>
          <label class="field">
            <span>相手の家の駅</span>
            <input type="text" id="s-partner" placeholder="例：〇〇" list="station-list">
          </label>
          <label class="field">
            <span>相手の家から駅まで</span>
            <span class="unit"><input type="number" id="s-partner-walk" min="0" step="1" inputmode="numeric">分</span>
          </label>
          <label class="field">
            <span>待ち・乗り換えの余裕</span>
            <span class="unit"><input type="number" id="s-buffer" min="0" step="1" inputmode="numeric">分</span>
          </label>
        </div>
        <p class="sub-h">電車の時間（駅から駅・片道）</p>
        <div id="pairs" class="pairs"></div>
      </div>
      <datalist id="station-list"></datalist>
    </section>

    <section class="edit">
      <h2>候補</h2>
      <div id="cands"></div>
      <button type="button" class="ghost" id="add">候補を足す</button>
    </section>
  </details>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
